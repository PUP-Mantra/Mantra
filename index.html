<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mantra Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="logo">
    <img src="login-logo/logo-1.png" alt="">
    <img src="login-logo/logo-2.png" alt="">
    <img src="login-logo/logo-3.png" alt="">
    <img src="login-logo/logo-4.png" alt="">
    <img src="login-logo/logo-5.png" alt="">
    <img src="login-logo/logo-6.png" alt="">
  </div>

  <main class="login-card">
    <h1 class="brand">mantra</h1>

    <form id="loginForm" novalidate>
      <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" required>
      <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
      <p id="message" role="alert" aria-live="polite"></p>
      <button type="submit" id="loginBtn">Login</button>
    </form>
  </main>

  <script src="login.js"></script>
</body>
</html>
